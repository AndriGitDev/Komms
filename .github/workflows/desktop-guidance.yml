name: Desktop connection guidance

on:
  pull_request:
    paths:
      - 'apps/desktop/ui/**'
      - 'locales/**'
      - 'scripts/localization.py'
      - '.github/workflows/desktop-guidance.yml'
  push:
    branches: [main]
    paths:
      - 'apps/desktop/ui/**'
      - 'locales/**'
      - 'scripts/localization.py'
      - '.github/workflows/desktop-guidance.yml'

permissions:
  contents: read

jobs:
  guidance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: node --test apps/desktop/ui/connection-guide.test.cjs
      - run: node --check apps/desktop/ui/main.js
      - run: python3 scripts/localization.py check
      - run: python3 scripts/check-localization-sources.py
