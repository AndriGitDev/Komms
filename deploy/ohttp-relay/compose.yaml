name: komms-ohttp-relay

services:
  ohttp-relay:
    image: ${KOMMS_OHTTP_RELAY_IMAGE:?set KOMMS_OHTTP_RELAY_IMAGE to an immutable digest}
    build:
      context: ../..
      dockerfile: deploy/ohttp-relay/Dockerfile
      args:
        KOMMS_SOURCE_REVISION: ${KOMMS_SOURCE_REVISION:-unbound-local-build}
        SOURCE_DATE_EPOCH: ${SOURCE_DATE_EPOCH:-0}
    restart: unless-stopped
    read_only: true
    user: "${KOMMS_OHTTP_RELAY_UID:-10004}:${KOMMS_OHTTP_RELAY_GID:-10004}"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    init: true
    pids_limit: 128
    mem_limit: 256m
    memswap_limit: 256m
    mem_swappiness: 0
    cpus: 1.0
    ulimits:
      core:
        soft: 0
        hard: 0
      nofile:
        soft: 4096
        hard: 4096
    ports:
      - "${KOMMS_OHTTP_RELAY_PORT:-8445}:8445/tcp"
    tmpfs:
      - /run/komms-ohttp:rw,noexec,nosuid,nodev,size=16m,uid=${KOMMS_OHTTP_RELAY_UID:-10004},gid=${KOMMS_OHTTP_RELAY_GID:-10004},mode=0700
      - /tmp:rw,noexec,nosuid,nodev,size=16m,uid=${KOMMS_OHTTP_RELAY_UID:-10004},gid=${KOMMS_OHTTP_RELAY_GID:-10004},mode=0700
    volumes:
      - type: bind
        source: ${KOMMS_OHTTP_RELAY_CONFIG:-./ohttp-relay.toml}
        target: /etc/komms-ohttp/config.toml
        read_only: true
      - type: bind
        source: ${KOMMS_OHTTP_RELAY_KEYS_DIR:?set KOMMS_OHTTP_RELAY_KEYS_DIR}
        target: /run/komms-ohttp-service-keys
        read_only: true
      - type: bind
        source: ${KOMMS_OHTTP_GATEWAY_CA_FILE:?set KOMMS_OHTTP_GATEWAY_CA_FILE}
        target: /run/komms-ohttp-gateway-ca/roots.pem
        read_only: true
    logging:
      driver: none
    stop_grace_period: 15s
    healthcheck:
      test:
        - CMD
        - kult-ohttp-relay
        - probe
        - --address
        - 127.0.0.1:8083
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3
