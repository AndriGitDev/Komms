[package]
name = "kult-conformance"
description = "Komms stable-v1 language-neutral conformance adapter and fixture verifier"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
argon2 = "0.5"
blake3 = "1"
chacha20poly1305 = "0.10"
ed25519-dalek = "2"
hkdf = "0.12"
kult-crypto = { version = "0.3.0", path = "../kult-crypto" }
kult-protocol = { version = "0.3.0", path = "../kult-protocol" }
kult-store = { version = "0.3.0", path = "../kult-store" }
kult-transport = { version = "0.3.0", path = "../kult-transport" }
hex = "0.4"
postcard = { version = "1", default-features = false, features = ["alloc"] }
rand_core = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
x25519-dalek = { version = "2", features = ["static_secrets"] }
