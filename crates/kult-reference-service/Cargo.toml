[package]
name = "kult-reference-service"
description = "Operator-minimized Komms bootstrap, DHT cache, and rendezvous service"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "kult-reference-service"
path = "src/main.rs"

[dependencies]
clap = { version = "4", default-features = false, features = [
    "derive",
    "std",
    "help",
    "usage",
    "error-context",
] }
futures = "0.3"
hex = "0.4"
hmac = "0.12"
kult-crypto = { version = "0.3.0", path = "../kult-crypto" }
kult-protocol = { version = "0.3.0", path = "../kult-protocol" }
kult-rendezvous = { version = "0.3.0", path = "../kult-rendezvous" }
libc = "0.2"
libp2p = { version = "0.56", features = [
    "tokio",
    "quic",
    "tcp",
    "noise",
    "yamux",
    "kad",
    "identify",
    "macros",
    "ed25519",
] }
rand_core = { version = "0.6", features = ["getrandom"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "net",
    "sync",
    "time",
    "io-util",
    "signal",
] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
toml = "0.5"
zeroize = "1"

[dev-dependencies]
kult-transport = { version = "0.3.0", path = "../kult-transport" }
rcgen = "0.13"
tempfile = "3"
