[package]
name = "kult-store"
description = "Komms encrypted local-first storage: every blob individually AEAD-sealed under an Argon2id-rooted key hierarchy. Spec: docs/07-storage.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = []
test-failpoints = []
legacy-test-fixtures = []

[dependencies]
kult-crypto = { version = "0.4.0", path = "../kult-crypto" }
kult-protocol = { version = "0.4.0", path = "../kult-protocol" }
rusqlite = { version = "0.31", features = ["bundled"] }
rand_core = { version = "0.6", features = ["getrandom"] }
serde = { version = "1", features = ["derive"] }
postcard = { version = "1", default-features = false, features = ["alloc"] }
zeroize = "1"
fs2 = "0.4"
libc = "0.2"

[target.'cfg(any(unix, windows))'.dependencies]
atomicwrites = "0.4.4"

[dev-dependencies]
proptest = "1"
rand = "0.8"
tempfile = "3"

[[test]]
name = "backup"
path = "tests/backup.rs"
required-features = ["legacy-test-fixtures"]

[[test]]
name = "m2_sneakernet"
path = "tests/m2_sneakernet.rs"
required-features = ["legacy-test-fixtures"]
