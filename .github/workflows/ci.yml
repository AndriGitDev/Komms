name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

# Publication happens only after the complete local release gate. If an
# authorized follow-up push supersedes a run, do not pay for both copies.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: fmt, clippy, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
      - name: rustfmt
        run: cargo fmt --all --check
      - name: release version alignment
        run: python3 scripts/check-release-version.py
      - name: documentation controls
        run: python3 scripts/check-docs.py
      - name: localization contract
        run: |
          python3 scripts/localization.py check
          python3 scripts/check-localization-sources.py
          python3 scripts/test-localization.py
      - name: message-request accessibility contract
        run: python3 scripts/check-message-request-accessibility.py
      - name: cross-shell accessibility contract
        run: python3 scripts/check-shell-accessibility.py
      - name: contributor profile controls
        run: python3 scripts/test-contributor-check.py
      - name: operator and stewardship controls
        run: |
          python3 scripts/check-stewardship.py
          python3 scripts/test-stewardship.py
      - name: release engineering controls
        run: |
          python3 scripts/check-release-engineering.py
          python3 scripts/test-android-license-evidence.py
          python3 scripts/test-release-evidence.py
          python3 scripts/test-release-qualification.py
          python3 scripts/test-release-signing.py
          python3 scripts/test-stable-beta-readiness.py
          python3 scripts/test-stage-release-artifacts.py
      - name: stable-v1 conformance
        run: |
          cargo build --locked -p kult-conformance
          python3 scripts/update-conformance-vectors.py \
            --check --adapter target/debug/kult-conformance
          python3 scripts/build-conformance-kit.py --check
          python3 conformance/v1/run.py \
            --adapter target/debug/kult-conformance
      - name: clippy
        run: cargo clippy --workspace --all-targets --all-features
      - name: tests
        run: cargo test --workspace --all-features
      - name: no_std build (kult-crypto)
        run: cargo build -p kult-crypto --no-default-features
      - name: no_std build (kult-protocol)
        run: cargo build -p kult-protocol --no-default-features

  # Build-compatibility gate only: no -D warnings here, because lint output
  # drifts across compiler versions and this job answers exactly one
  # question — does the declared rust-version still compile the workspace?
  msrv:
    name: MSRV 1.88 check
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: ""
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: "1.88"
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
      - name: cargo check
        run: cargo check --workspace --all-features --all-targets

  storage-windows:
    name: opaque storage on Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
      - name: qualify storage host
        shell: pwsh
        run: |
          $volume = Get-Volume -DriveLetter (Get-Location).Drive.Name
          if ($volume.FileSystemType -ne "NTFS") {
            throw "Storage tests require an explicitly identified NTFS volume"
          }
          Write-Output "OS: $([System.Runtime.InteropServices.RuntimeInformation]::OSDescription)"
          Write-Output "Filesystem: $($volume.FileSystemType)"
      - name: kult-store tests
        run: cargo test -p kult-store --all-features -- --test-threads=1

  desktop:
    name: desktop app (fmt, clippy, tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/desktop/src-tauri
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: system dependencies (Tauri on Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev dbus-x11 xvfb
        working-directory: .
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          workspaces: apps/desktop/src-tauri
      - name: rustfmt
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --all-targets --all-features
      - name: tests
        run: cargo test --all-features
      - name: build Linux desktop shell
        run: cargo build --bin komms-desktop
      - name: launch Linux desktop shell under Xvfb
        run: ../../../scripts/smoke-linux-desktop.sh target/debug/komms-desktop

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: EmbarkStudios/cargo-deny-action@b66acf5e9fe20f8aba065be86778a8a4c846f902 # v2
      - name: desktop app workspace
        uses: EmbarkStudios/cargo-deny-action@b66acf5e9fe20f8aba065be86778a8a4c846f902 # v2
        with:
          manifest-path: apps/desktop/src-tauri/Cargo.toml

  fuzz-smoke:
    name: fuzz smoke (60s per target)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: nightly
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          workspaces: crates/kult-crypto/fuzz
      - name: install cargo-fuzz
        run: cargo install cargo-fuzz --version 0.13.2 --locked
      - name: fuzz kult-crypto targets
        working-directory: crates/kult-crypto
        run: |
          for t in envelope_decode handshake_decode bundle_decode mnemonic_decode attachment_chunk_open device_prekey_decode call_media_open group_origin_envelope_decode discovery_decode rendezvous_open; do
            cargo +nightly fuzz run "$t" -- -max_total_time=60
          done
      - name: fuzz kult-protocol targets
        working-directory: crates/kult-protocol
        run: |
          for t in protocol_envelope_decode admission_envelope_decode bundle_import reassembler_insert content_decode capability_decode attachment_manifest_decode attachment_bulk_decode attachment_ranges mention_decode edit_decode ephemeral_decode poll_decode group_authority_decode group_control_decode device_sync_bundle_decode call_control_decode discovery_control_decode rendezvous_decode wake_decode; do
            cargo +nightly fuzz run "$t" -- -max_total_time=60
          done

  android-core:
    name: android core (bindings + JVM e2e)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/android
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4
        with:
          gradle-version: "8.14.3"
      - name: build and test :core (generated bindings + two-node e2e, no Android SDK)
        run: gradle :core:build -Pkomms.androidApp=false

  ios-core:
    name: ios core (bindings + Swift e2e)
    runs-on: ubuntu-latest
    # Official Swift toolchain image; Rust goes in via rustup. The job runs
    # KommsCore's tests — including the two-node e2e — against the
    # host-built libkult_ffi, no Xcode or simulator involved.
    container: swift:6.1-noble@sha256:e1cdaf7ddc9de37d8561da7a260535236694fca8c1b67d3129d47d8b180a9394
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: install Rust
        # The Swift image ships no Rust. Fetch the exact rustup-init binary,
        # verify the Rust-hosted checksum, and install a minimal toolchain.
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            curl ca-certificates build-essential
          curl \
            --proto '=https' \
            --tlsv1.2 \
            --fail \
            --silent \
            --show-error \
            https://static.rust-lang.org/rustup/archive/1.28.2/x86_64-unknown-linux-gnu/rustup-init \
            --output /tmp/rustup-init
          echo "20a06e644b0d9bd2fbdbfd52d42540bdde820ea7df86e92e533c073da0cdd43c  /tmp/rustup-init" \
            | sha256sum --check
          chmod 0755 /tmp/rustup-init
          /tmp/rustup-init -y --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
      - name: generate bindings and run KommsCore tests (two-node e2e)
        run: apps/ios/scripts/test-core.sh

  # macOS runners are billed 10x on private repos, so the simulator build of
  # the SwiftUI shell is armed explicitly: set the repository variable
  # IOS_APP_CI=1 to enable it. The behavior layer is still covered on every
  # push by the Linux ios-core job above.
  ios-app:
    name: ios app (simulator build)
    if: vars.IOS_APP_CI == '1'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: select pinned Xcode
        run: |
          echo "DEVELOPER_DIR=/Applications/Xcode_16.4.app/Contents/Developer" \
            >> "$GITHUB_ENV"
          xcode_info="$(
            /Applications/Xcode_16.4.app/Contents/Developer/usr/bin/xcodebuild \
              -version
          )"
          if [[ "$xcode_info" != $'Xcode 16.4\nBuild version 16F6' ]]; then
            echo "Pinned Xcode build is unavailable." >&2
            exit 1
          fi
          printf '%s\n' "$xcode_info"
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: stable
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
      - name: install xcodegen
        run: |
          scripts/install-xcodegen.sh "$RUNNER_TEMP/xcodegen"
          echo "$RUNNER_TEMP/xcodegen/bin" >> "$GITHUB_PATH"
      - name: assemble KultFFI.xcframework (Rust static libs per platform)
        run: apps/ios/scripts/build-xcframework.sh
      - name: generate project and build for the simulator
        working-directory: apps/ios/KommsApp
        run: |
          xcodegen generate
          xcodebuild -project KommsApp.xcodeproj -scheme KommsApp \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build

  android-app:
    name: android apps (Play + Google-free)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/android
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: stable
          targets: aarch64-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
      - name: install cargo-ndk
        run: cargo install cargo-ndk --version 4.1.2 --locked
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4
        with:
          gradle-version: "8.14.3"
      - name: install pinned Android platform and NDK
        run: |
          android_sdk="${ANDROID_SDK_ROOT:-${ANDROID_HOME:?}}"
          sdkmanager_bin="$android_sdk/cmdline-tools/latest/bin/sdkmanager"
          test -x "$sdkmanager_bin"
          "$sdkmanager_bin" --install \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;27.2.12479018"
          echo "ANDROID_NDK_HOME=$android_sdk/ndk/27.2.12479018" \
            >> "$GITHUB_ENV"
      - name: build, test, and lint both distribution flavors
        run: |
          gradle \
            :app:assemblePlayDebug :app:assembleGoogleFreeDebug \
            :app:testPlayDebugUnitTest :app:testGoogleFreeDebugUnitTest \
            :app:lintPlayDebug :app:lintGoogleFreeDebug \
            -Pkomms.androidApp=true
          ../../scripts/check-android-google-free.sh
      - name: upload Play APK artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: komms-android-play-debug
          path: apps/android/app/build/outputs/apk/play/debug/app-play-debug.apk
          retention-days: 30
      - name: upload Google-free APK artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: komms-android-google-free-debug
          path: apps/android/app/build/outputs/apk/googleFree/debug/app-googleFree-debug.apk
          retention-days: 30
